<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowStudio</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-wrapper">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-logo">FS</span>
        <span class="brand-name">FlowStudio</span>
        <span class="version-badge" id="version-badge">v3.3.0</span>
        <button id="btn-check-update" class="btn-check-update" title="Check for updates">↻</button>
      </div>
      <div class="hw-pill" id="hw-pill">
        <span class="status-dot" id="status-dot"></span>
        <span id="hw-label">Connecting...</span>
      </div>
    </header>

    <!-- Update Banner -->
    <div class="update-banner" id="update-banner" style="display: none;">
      <div class="update-banner-content">
        <span class="update-banner-text">Update available: <strong id="update-version">v3.3.0</strong></span>
        <button id="btn-update-now" class="btn-update-now">Update Now</button>
      </div>
      <div id="update-status" class="update-status" style="display: none;"></div>
    </div>

    <!-- Controls Card (4 Clean Rows Only) -->
    <section class="card controls-card" id="controls-card">
      <div class="row">
        <span class="row-label">Extension Active</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-enabled">
          <span class="slider"></span>
        </label>
      </div>

      <div class="subtle-notice" id="subtle-notice" style="display: none;">
        Download interception paused (GPU Server Active)
      </div>

      <div class="row sub-row" id="row-autowake">
        <span class="row-label">Auto-Wake on Flow</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-autowake" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="row sub-row" id="row-suffix">
        <span class="row-label">Add _clean Suffix</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggle-suffix">
          <span class="slider"></span>
        </label>
      </div>

      <div class="row sub-row" id="row-upscale">
        <span class="row-label">AI Upscale</span>
        <select id="select-upscale" class="compact-select">
          <option value="off">Off (Original)</option>
          <option value="1080p_anime">1080p Anime</option>
          <option value="1080p_cinema">1080p Cinema</option>
          <option value="2k_anime">2K Anime</option>
          <option value="2k_cinema">2K Cinema</option>
          <option value="4k_anime">4K Anime</option>
          <option value="4k_cinema">4K Cinema</option>
        </select>
      </div>
    </section>

    <!-- Live Process Card -->
    <section class="card activity-card">
      <div class="card-header">
        <span class="card-title">Recent Activity</span>
        <span class="activity-badge" id="activity-badge">0 items</span>
      </div>
      <div class="activity-list" id="activity-list">
        <div class="empty-state">Download from Flow to auto-clean</div>
      </div>
    </section>

    <!-- Slim Footer -->
    <footer class="footer">
      <button id="btn-open-studio" class="btn-studio">Batch Studio (50+ & ZIP) ↗</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
